<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body{
            font-family: Arial;
            background-color: gray;
        }

        .container{
            width: 350px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        h2{
            text-align: center;
        }

        label{
            display: block;
            margin-top: 10px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"]{
            width: 90%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid black;
            border-radius: 3px;

        }

        button{
            margin-top: 15px;
            padding: 8px 15px;
            border-radius: 3px;
            border: 1px solid;
            cursor: pointer;
        }
        button[type="submit"]{
            background-color: rgb(15, 231, 15);
            color: rgb(20, 19, 19);
        }
        button[type="reset"]{
            background-color: rgb(230, 86, 61);
            color: rgb(58, 53, 53);
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Registration Form</h2>

    <form id="registrationForm">

        <label for="fn">First Name</label>
        <input type="text" id="fn" required>

        <label for="ln">Last Name</label>
        <input type="text" id="ln" required>

        <label for="roll">Roll No</label>
        <input type="text" id="roll" required>

        <label for="ph">Phone Number</label>
        <input type="tel" id="ph" pattern="[0-9]{10}" placeholder="10-digit number" required>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label>Gender</label>
        <input type="radio" name="gender" value="Male" required> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Others"> Others

        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>
</div>
<script>
document.getElementById("registrationForm").onsubmit = function(event) {
    event.preventDefault();
    alert("Registration Successful!");
};
</script>
</body>
</html>
